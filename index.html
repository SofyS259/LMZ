    <style>
  #info-modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    max-width: 90%;
    max-height: 80vh;
    background: rgba(128, 0, 0, 0.8); /* <-- (Maroon с прозрачностью) */
    color: #ffffff;
    font-family: 'Roboto', Arial, sans-serif;
    padding: 30px;
    border-radius: 8px;
    overflow-y: auto;
    z-index: 9999;
  }
  #modal-text {
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 16px;
  }
  #modal-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 10px;
  }
  #close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 28px;
    cursor: pointer;
    color: #ffffff;
  }
  #close-btn:hover { color: #cccccc; }
</style>

    <script>
      // Глобальный флаг для паузы движения
      window.isUIOpen = false;

      // --- Компонент расстановки экспонатов ---
      AFRAME.registerComponent('exhibit-point', {
  schema: {
    pos: { type: 'vec3', default: '0 1.5 0' },
    id: { type: 'string', default: 'one' }
  },
  init: function () {
  this.el.setAttribute('position', this.data.pos);
  this.el.setAttribute('gltf-model', '#info-model');  // ← используем кэш
  this.el.classList.add('clickable');                  // ← заодно пункт 6
  
  this.el.addEventListener('click', () => {
      const data = museumData[this.data.id];
      if (!data) return;
      
      document.getElementById('modal-title').innerText = data.title || "Без названия";
      document.getElementById('modal-text').innerText = data.fullText || data.shortText || "";
      document.getElementById('info-modal').style.display = 'block';
      window.isUIOpen = true;
    });
  }
});
      // --- Логика закрытия окна ---
      function closeExhibit() {
        document.getElementById('info-modal').style.display = 'none';
        window.isUIOpen = false;
      }
      
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && window.isUIOpen) closeExhibit();
      });
      
      document.getElementById('info-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeExhibit();

      });

      // --- компонент движения (с паузой) ---
      function parseVector(el, attr) {
        const val = el.getAttribute(attr);
        if (!val) return { x: 0, y: 0, z: 0 };
        if (typeof val === 'object' && val.x !== undefined) {
          return { x: parseFloat(val.x) || 0, y: parseFloat(val.y) || 0, z: parseFloat(val.z) || 0 };
        }
        const parts = String(val).trim().split(/\s+/).map(parseFloat);
        return { x: parts[0] || 0, y: parts[1] || 0, z: parts[2] || 0 };
      }

      AFRAME.registerComponent('player-movement', {
        schema: {
          speed: { type: 'number', default: 0.3 },
          radius: { type: 'number', default: 0.5 },
          subSteps: { type: 'number', default: 4 }
        },

        init: function() {
          this.walls = [];
          this.keys = {};

          this.onKeyDown = this.onKeyDown.bind(this);
          this.onKeyUp = this.onKeyUp.bind(this);
          document.addEventListener('keydown', this.onKeyDown);
          document.addEventListener('keyup', this.onKeyUp);

          const initWalls = () => {
            const wallEls = document.querySelectorAll('[wall-collider]');
            this.walls = Array.from(wallEls).map(wall => {
              const pos = parseVector(wall, 'position');
              const rot = parseVector(wall, 'rotation');
              const width = parseFloat(wall.getAttribute('width')) || 1;
              const depth = parseFloat(wall.getAttribute('depth')) || 1;
              
              return {
                x: pos.x,
                z: pos.z,
                rotY: (rot.y || 0) * Math.PI / 180,
                halfWidth: width / 2,
                halfDepth: depth / 2
              };
            });
            console.log('Walls initialized:', this.walls.length);
          };

          if (this.el.sceneEl.hasLoaded) {
            initWalls();
          } else {
            this.el.sceneEl.addEventListener('loaded', initWalls);
          }
        },

        onKeyDown: function(e) {
          this.keys[e.code] = true;
        },

        onKeyUp: function(e) {
          this.keys[e.code] = false;
        },

        tick: function(time, delta) {
          // ПАУЗА: если окно открыто, движение не обрабатывается
          if (window.isUIOpen) return;
          
          if (!this.walls.length) return;

          const pos = parseVector(this.el, 'position');
          const camera = this.el.querySelector('a-camera');
          const cameraRot = parseVector(camera, 'rotation');
          
          const yaw = cameraRot.y * Math.PI / 180;
          const speed = this.data.speed;
          const radius = this.data.radius;
          const subSteps = this.data.subSteps;
          
          let moveX = 0;
          let moveZ = 0;

          if (this.keys['KeyW'] || this.keys['ArrowUp']) {
            moveX -= Math.sin(yaw) * speed;
            moveZ -= Math.cos(yaw) * speed;
          }
          if (this.keys['KeyS'] || this.keys['ArrowDown']) {
            moveX += Math.sin(yaw) * speed;
            moveZ += Math.cos(yaw) * speed;
          }
          if (this.keys['KeyA'] || this.keys['ArrowLeft']) {
            moveX -= Math.cos(yaw) * speed;
            moveZ += Math.sin(yaw) * speed;
          }
          if (this.keys['KeyD'] || this.keys['ArrowRight']) {
            moveX += Math.cos(yaw) * speed;
            moveZ -= Math.sin(yaw) * speed;
          }

          if (moveX === 0 && moveZ === 0) return;

          let currentX = pos.x;
          let currentZ = pos.z;

          for (let step = 0; step < subSteps; step++) {
            const stepX = moveX / subSteps;
            const stepZ = moveZ / subSteps;
            
            let newX = currentX + stepX;
            let newZ = currentZ + stepZ;
            
            let collidedX = false;
            let collidedZ = false;
            
            for (const wall of this.walls) {
              if (this.checkCollision(newX, currentZ, wall, radius)) {
                collidedX = true;
                break;
              }
            }
            
            if (!collidedX) {
              currentX = newX;
            }
            
            for (const wall of this.walls) {
              if (this.checkCollision(currentX, newZ, wall, radius)) {
                collidedZ = true;
                break;
              }
            }
            
            if (!collidedZ) {
              currentZ = newZ;
            }
          }

          this.el.setAttribute('position', { x: currentX, y: pos.y, z: currentZ });
        },
        
        checkCollision: function(playerX, playerZ, wall, radius) {
          const dx = playerX - wall.x;
          const dz = playerZ - wall.z;
          
          const cos = Math.cos(-wall.rotY);
          const sin = Math.sin(-wall.rotY);
          
          const localX = dx * cos - dz * sin;
          const localZ = dx * sin + dz * cos;

          const minX = wall.halfWidth + radius;
          const minZ = wall.halfDepth + radius;

          return Math.abs(localX) < minX && Math.abs(localZ) < minZ;
        },

        remove: function() {
          document.removeEventListener('keydown', this.onKeyDown);
          document.removeEventListener('keyup', this.onKeyUp);
        }
      });
    </script>
    <script>
// Компонент для перетаскивания
AFRAME.registerComponent('draggable', {
  init: function () {
    this.isDragging = false;
    
    this.el.addEventListener('mousedown', (e) => {
      this.isDragging = true;
    });
    
    this.onMouseMove = (e) => {
      if (!this.isDragging) return;
      
      const pos = this.el.getAttribute('position');
      pos.x += e.movementX * 0.01;
      pos.y -= e.movementY * 0.01;
      this.el.setAttribute('position', pos);
    };
    
    this.onMouseUp = () => {
      this.isDragging = false;
    };
    
    document.addEventListener('mousemove', this.onMouseMove);
    document.addEventListener('mouseup', this.onMouseUp);
  },
  
  remove: function() {
    document.removeEventListener('mousemove', this.onMouseMove);
    document.removeEventListener('mouseup', this.onMouseUp);
  }
});

// Компонент для показа текста из data.js

AFRAME.registerComponent('show-info', {
  init: function () {
    const key = this.el.getAttribute('data-info-index');
    
    this.el.addEventListener('click', () => {
      if (!key || typeof museumData === 'undefined' || !museumData[key]) return;
      
      const info = museumData[key];
      const title = info.title || "Без названия";
      const text = info.fullText || info.shortText || "";
      
      if (!text) return;
      
      // Удаляем старый контейнер если есть
      let oldContainer = document.querySelector('#info-text-3d');
      if (oldContainer) oldContainer.remove();
      
      // Ставим паузу движения
      window.isUIOpen = true;
      
      // Создаем контейнер
      let container = document.createElement('a-entity');
      container.id = 'info-text-3d';
      container.setAttribute('position', '0 0 -2.5'); // ← прямо перед глазами
      
      
      // Фон панели (тёмно-красный, как в модальном окне)
      let bg = document.createElement('a-plane');
      bg.setAttribute('width', '3.2');
      bg.setAttribute('height', '2.2');
      bg.setAttribute('color', '#800000'); // Maroon
      bg.setAttribute('opacity', '0.9');
      container.appendChild(bg);
      
      // Заголовок
      let titleText = document.createElement('a-text');
      titleText.setAttribute('value', title);
      titleText.setAttribute('align', 'center');
      titleText.setAttribute('width', '3');
      titleText.setAttribute('color', '#ffffff');
      titleText.setAttribute('position', '0 0.85 0.01');
      titleText.setAttribute('wrap-count', '35');
      titleText.setAttribute('font', 'mozillavr');
      container.appendChild(titleText);
      
      // Разделительная линия под заголовком
      let divider = document.createElement('a-plane');
      divider.setAttribute('width', '2.8');
      divider.setAttribute('height', '0.01');
      divider.setAttribute('color', '#ffffff');
      divider.setAttribute('opacity', '0.3');
      divider.setAttribute('position', '0 0.65 0.01');
      container.appendChild(divider);
      
      // Основной текст
      let mainText = document.createElement('a-text');
      mainText.setAttribute('value', text);
      mainText.setAttribute('align', 'center');
      mainText.setAttribute('width', '2.8');
      mainText.setAttribute('color', '#ffffff');
      mainText.setAttribute('position', '0 -0.1 0.01');
      mainText.setAttribute('wrap-count', '45');
      mainText.setAttribute('line-height', '50');
      container.appendChild(mainText);
      
      // Кнопка закрытия (крестик)
      let closeBtn = document.createElement('a-text');
      closeBtn.setAttribute('value', '×');
      closeBtn.setAttribute('align', 'center');
      closeBtn.setAttribute('width', '1');
      closeBtn.setAttribute('color', '#ffffff');
      closeBtn.setAttribute('position', '1.4 0.95 0.02');
      closeBtn.setAttribute('class', 'clickable close-btn-3d');
      container.appendChild(closeBtn);
      
      // Обработчик клика на крестик
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        container.remove();
        window.isUIOpen = false;
      });
      
      const camera = document.querySelector('#player a-camera');
camera.appendChild(container);
      
      // Автоматическое скрытие через 15 секунд
      setTimeout(() => {
        if (container.parentNode) {
          container.remove();
          window.isUIOpen = false;
        }
      }, 15000);
    });
  }
});

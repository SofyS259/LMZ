<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Museum</title>
    <script src="aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #F0F0F0;">
      
      <!-- Освещение -->
      <!-- Общий свет -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>

      <!-- Точечные лампы (расставь по координатам комнаты) -->
      <a-light type="point" position="0 2.5 0" intensity="1.5" distance="10" color="#ffffff"></a-light>
      <a-light type="point" position="-3 2.5 -3" intensity="1" distance="8" color="#ffeedd"></a-light>
      <a-light type="point" position="3 2.5 3" intensity="1" distance="8" color="#ffeedd"></a-light>
      
      <!-- Модели -->
      <a-entity gltf-model="url(1ploski.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(1yadra.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(2ploski.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(2recep.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(first.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(lable.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(rec.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(slav.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(stena.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(stolb.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(tryu.glb)" position="0 0 -5"></a-entity>
      
    </a-scene>
  </body>
</html>

      <!-- Игрок -->
      <a-entity id="player" position="0 0 -5" player-movement>

      <!-- Невидимый пол -->

      <!-- Стены -->

      <a-box position="33.877 2.672 -37.812" width="1" height="10" depth="55" wall-collider></a-box>

      <a-box position="25.013 2.672 -72.803" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="18.641 2.672 -2.104" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="-10.235 2.672 -2.104" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="4.061 2.672 4.993" width="1" height="10" depth="30" rotation="0 90 0" wall-collider></a-box>
      <a-box position="10.713 2.672 -80.527" width="1" height="10" depth="30" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-11.954 2.672 -47.199" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-12.066 2.672 -34.922" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-12.066 2.672 -23.201" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="26.872 2.672 -24.996" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="26.984 2.672 -52.376" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>

      <!-- Модели -->
      <a-entity gltf-model="url(enime.glb)" position="0 0 -5"></a-entity>
      
    </a-scene>

    <script>
      // Вспомогательная функция для парсинга векторов
      function parseVector(el, attr) {
        const val = el.getAttribute(attr);
        if (!val) return { x: 0, y: 0, z: 0 };
        if (typeof val === 'object' && val.x !== undefined) {
          return { x: parseFloat(val.x) || 0, y: parseFloat(val.y) || 0, z: parseFloat(val.z) || 0 };
        }
        const parts = String(val).trim().split(/\s+/).map(parseFloat);
        return { x: parts[0] || 0, y: parts[1] || 0, z: parts[2] || 0 };
      }

      AFRAME.registerComponent('player-movement', {
        schema: {
          speed: { type: 'number', default: 0.05 },
          radius: { type: 'number', default: 0.4 }
        },

        init: function() {
          this.velocity = new THREE.Vector3();
          this.direction = new THREE.Vector3();
          this.walls = [];
          this.keys = {};

          // Обработчики клавиш
          this.onKeyDown = this.onKeyDown.bind(this);
          this.onKeyUp = this.onKeyUp.bind(this);
          document.addEventListener('keydown', this.onKeyDown);
          document.addEventListener('keyup', this.onKeyUp);

          // Инициализация стен после загрузки сцены
          const initWalls = () => {
            const wallEls = document.querySelectorAll('[wall-collider]');
            this.walls = Array.from(wallEls).map(wall => {
              const pos = parseVector(wall, 'position');
              const rot = parseVector(wall, 'rotation');
              const width = parseFloat(wall.getAttribute('width')) || 1;
              const depth = parseFloat(wall.getAttribute('depth')) || 1;
              
              return {
                x: pos.x,
                z: pos.z,
                rotY: (rot.y || 0) * Math.PI / 180,
                halfWidth: width / 2,
                halfDepth: depth / 2
              };
            });
            console.log('Walls initialized:', this.walls.length);
          };

          if (this.el.sceneEl.hasLoaded) {
            initWalls();
          } else {
            this.el.sceneEl.addEventListener('loaded', initWalls);
          }
        },

        onKeyDown: function(e) {
          this.keys[e.code] = true;
        },

        onKeyUp: function(e) {
          this.keys[e.code] = false;
        },

        tick: function(time, delta) {
          if (!this.walls.length) return;

          const pos = parseVector(this.el, 'position');
          const camera = this.el.querySelector('a-camera');
          const cameraRot = parseVector(camera, 'rotation');
          
          // Вычисляем направление движения
          const yaw = cameraRot.y * Math.PI / 180;
          const speed = this.data.speed;
          
          let moveX = 0;
          let moveZ = 0;

          if (this.keys['KeyW'] || this.keys['ArrowUp']) {
            moveX -= Math.sin(yaw) * speed;
            moveZ -= Math.cos(yaw) * speed;
          }
          if (this.keys['KeyS'] || this.keys['ArrowDown']) {
            moveX += Math.sin(yaw) * speed;
            moveZ += Math.cos(yaw) * speed;
          }
          if (this.keys['KeyA'] || this.keys['ArrowLeft']) {
            moveX -= Math.cos(yaw) * speed;
            moveZ += Math.sin(yaw) * speed;
          }
          if (this.keys['KeyD'] || this.keys['ArrowRight']) {
            moveX += Math.cos(yaw) * speed;
            moveZ -= Math.sin(yaw) * speed;
          }

          if (moveX === 0 && moveZ === 0) return;

          // Проверяем и применяем движение по X и Z отдельно
          let newX = pos.x + moveX;
          let newZ = pos.z + moveZ;
          const radius = this.data.radius;

          // Проверка коллизий для каждой стены
          for (const wall of this.walls) {
            // Переводим позицию игрока в локальную систему стены
            const dx = newX - wall.x;
            const dz = newZ - wall.z;
            
            const cos = Math.cos(-wall.rotY);
            const sin = Math.sin(-wall.rotY);
            
            const localX = dx * cos - dz * sin;
            const localZ = dx * sin + dz * cos;

            // Проверка пересечения
            const minX = wall.halfWidth + radius;
            const minZ = wall.halfDepth + radius;

            if (Math.abs(localX) < minX && Math.abs(localZ) < minZ) {
              // Вычисляем перекрытие
              const overlapX = minX - Math.abs(localX);
              const overlapZ = minZ - Math.abs(localZ);

              // Выталкиваем по меньшей оси
              if (overlapX < overlapZ) {
                const sign = localX >= 0 ? 1 : -1;
                const adjustedLocalX = localX + sign * overlapX;
                const worldX = adjustedLocalX * Math.cos(wall.rotY) - localZ * Math.sin(wall.rotY);
                newX = wall.x + worldX;
              } else {
                const sign = localZ >= 0 ? 1 : -1;
                const adjustedLocalZ = localZ + sign * overlapZ;
                const worldZ = localX * Math.sin(wall.rotY) + adjustedLocalZ * Math.cos(wall.rotY);
                newZ = wall.z + worldZ;
              }
            }
          }

          // Применяем новую позицию
          this.el.setAttribute('position', { x: newX, y: pos.y, z: newZ });
        },

        remove: function() {
          document.removeEventListener('keydown', this.onKeyDown);
          document.removeEventListener('keyup', this.onKeyUp);
        }
      });
    </script>
  </body>
</html>

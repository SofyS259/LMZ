<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Museum</title>
    <!-- Локальный файл A-Frame -->
    <script src="aframe.min.js"></script>
    <!-- Физика -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v7.5.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #F0F0F0;" physics="debug: false">
      
      <!-- Базовый свет -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="hemisphere" color="#ffffff" groundColor="#888888" intensity="0.6"></a-light>
      
      <!-- Холл: окна (прожекторы) -->
      <a-light type="spot" position="4.772 2.589 4.393" angle="40" penumbra="0.7" intensity="2" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="spot" position="-7.531 2.589 4.748" angle="40" penumbra="0.7" intensity="2" distance="15" decay="1.5" color="#ffffff"></a-light>

      <!-- Холл (точечные) -->
      <a-light type="point" position="3.977 8.526 2.367" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="-4.806 5.706 0.403" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>

      <a-light type="point" position="13.902 3.902 -5.047" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>

      <!-- Зал 1 -->
      <a-light type="point" position="-10.37 4.000 -32.02" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="3.092 4.000 -38.74" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-0.355 4.000 -53.82" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-13.34 4.000 -60.04" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-11.48 4.000 -42.23" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="2.428 4.000 -24.13" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-8.984 4.000 -20.79" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>

      <!-- Зал Славянов -->
      <a-light type="point" position="22.346 4.000 -67.391" intensity="1" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="11.944 4.000 -69.792" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="20.334 4.000 -76.570" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="3.601 4.000 -76.191" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="0.591 4.000 -67.081" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>

     
      <!-- Зал 2 -->
      <a-light type="point" position="32.509 4.000 -62.447" intensity="1" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="30.390 4.000 -13.787" intensity="2" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="26.770 4.000 -43.054" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="18.414 4.000 -26.737" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="16.207 4.000 -39.665" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="17.679 4.000 -60.540" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>


      <!-- Игрок с физикой -->
      <a-entity id="player" position="0 1.6 5" kinematic-body="mass: 60" movement-controls="speed: 0.15; fly: false">
        <a-camera look-controls="pointerLockEnabled: false"></a-camera>
      </a-entity>
      
      <!-- Стены с физикой (невидимые) -->
      <a-entity gltf-model="url(thndf.glb)" position="0 0 -5" static-body="shape: mesh; auto-restart: true" visible="false">
      </a-entity>

</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Museum</title>
    <script src="aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #F0F0F0;">
      
      <!-- Базовый ambient (ярче) -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>

      <!-- Точечные лампы (больше радиус) -->
      <a-light type="point" position="0 7 0" intensity="1.0" distance="15" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="0 7 -15" intensity="1.0" distance="15" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="0 7 -30" intensity="1.0" distance="15" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="0 7 -45" intensity="1.0" distance="15" color="#ffffff" decay="1.5"></a-light>

      <!-- Дополнительные лампы по бокам -->
      <a-light type="point" position="-8 7 -10" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="8 7 -10" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="-8 7 -25" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="8 7 -25" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="-8 7 -40" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      <a-light type="point" position="8 7 -40" intensity="0.8" distance="12" color="#ffffff" decay="1.5"></a-light>
      
      <!-- Модели -->
      <a-entity gltf-model="url(1ploski.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(1yadra.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(2ploski.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(2recep.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(first.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(lable.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(rec.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(slav.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(stena.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(stolb.glb)" position="0 0 -5"></a-entity>
      <a-entity gltf-model="url(tryu.glb)" position="0 0 -5"></a-entity>
      
    </a-scene>
  </body>
</html>

      <script>
AFRAME.registerComponent('wall-collision', {
  schema: {
    radius: {type: 'number', default: 0.5}
  },
  
  init: function() {
    this.directions = [
      new THREE.Vector3(1, 0, 0),
      new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(0, 0, 1),
      new THREE.Vector3(0, 0, -1)
    ];
    this.raycaster = new THREE.Raycaster();
    this.playerPos = new THREE.Vector3();
  },
  
  tick: function() {
    const el = this.el;
    const camera = el.querySelector('a-camera');
    if (!camera) return;
    
    const position = el.getAttribute('position');
    this.playerPos.set(position.x, position.y + 1, position.z);
    
    for (let dir of this.directions) {
      this.raycaster.set(this.playerPos, dir);
      this.raycaster.far = this.data.radius;
      
      const walls = document.querySelectorAll('[wall-collider]');
      const wallMeshes = Array.from(walls).map(w => w.object3D).filter(o => o);
      
      const intersects = this.raycaster.intersectObjects(wallMeshes, true);
      
      if (intersects.length > 0) {
        const newPos = position.clone();
        newPos.x -= dir.x * this.data.radius * 0.1;
        newPos.z -= dir.z * this.data.radius * 0.1;
        el.setAttribute('position', newPos);
      }
    }
  }
});
</script>

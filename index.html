<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Museum</title>
    <!-- Рекомендуется использовать актуальную версию A-Frame, если ваш локальный файл устарел -->
    <!-- <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script> -->
    <script src="aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #F0F0F0;">
      
      <!-- Базовый свет -->
      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="hemisphere" color="#ffffff" groundColor="#888888" intensity="0.6"></a-light>
      
      <!-- Холл: окна (прожекторы) -->

      <a-light type="spot" position="-7.531 2.589 4.748" angle="40" penumbra="0.7" intensity="2" distance="15" decay="1.5" color="#ffffff"></a-light>

      <!-- Холл (точечные) -->
      <a-light type="point" position="3.977 8.526 2.367" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="-4.806 5.706 0.403" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="-6.137 6.916 -7.381" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="-0.415 2.915 -6.664" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="7.251 6.102 -7.652" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="16.714 1.388 -15.661" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>
      <a-light type="point" position="13.902 3.902 -5.047" intensity="1.5" distance="15" decay="1.5" color="#ffffff"></a-light>

      <!-- Зал 1 -->
      <a-light type="point" position="-10.37 4.000 -32.02" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="3.092 4.000 -38.74" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-0.355 4.000 -53.82" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-13.34 4.000 -60.04" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-11.48 4.000 -42.23" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="2.428 4.000 -24.13" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="-8.984 4.000 -20.79" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>

      <!-- Зал Славянов -->
      <a-light type="point" position="22.346 4.000 -67.391" intensity="1" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="11.944 4.000 -69.792" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="20.334 4.000 -76.570" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="3.601 4.000 -76.191" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="0.591 4.000 -67.081" intensity="1" distance="10" decay="1" color="#ffffff"></a-light>

      <!-- Зал 2 -->
      <a-light type="point" position="32.509 4.000 -62.447" intensity="1" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="30.390 4.000 -13.787" intensity="2" distance="7" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="26.770 4.000 -43.054" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="18.414 4.000 -26.737" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="16.207 4.000 -39.665" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>
      <a-light type="point" position="17.679 4.000 -60.540" intensity="1" distance="20" decay="1" color="#ffffff"></a-light>

      <!-- Игрок с физикой и управлением -->
      <a-entity id="player" position="0 0 -5" player-movement="speed: 0.1; radius: 0.5">
        <a-camera look-controls="pointerLockEnabled: true"></a-camera>
      </a-entity>

      <!-- Невидимый пол с физикой -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" static-body visible="false"></a-plane>

      <!-- Стены с маркером wall-collider -->
      <a-box position="-19.018 2.672 -37.812" width="1" height="10" depth="55" wall-collider></a-box>
      <a-box position="33.877 2.672 -37.812" width="1" height="10" depth="55" wall-collider></a-box>
      <a-box position="7.857 2.672 -37.812" width="1" height="10" depth="55" wall-collider></a-box>
      <a-box position="7.370 2.672 -71.396" width="1" height="10" depth="12" wall-collider></a-box>
      <a-box position="-4.035 2.672 -72.900" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="25.013 2.672 -72.803" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="18.641 2.672 -2.104" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="-10.235 2.672 -2.104" width="1" height="10" depth="15" wall-collider></a-box>
      <a-box position="4.061 2.672 4.993" width="1" height="10" depth="30" rotation="0 90 0" wall-collider></a-box>
      <a-box position="10.713 2.672 -80.527" width="1" height="10" depth="30" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-11.954 2.672 -47.199" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-12.066 2.672 -34.922" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="-12.066 2.672 -23.201" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="26.872 2.672 -24.996" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>
      <a-box position="26.984 2.672 -52.376" width="1" height="10" depth="15" rotation="0 90 0" wall-collider></a-box>

      <!-- Модели -->
      <a-entity gltf-model="url(enime.glb)" position="0 0 -5"></a-entity>
      
    </a-scene>

    <script>
      AFRAME.registerComponent('player-movement', {
        schema: {
          speed: { type: 'number', default: 0.1 },
          radius: { type: 'number', default: 0.5 }
        },

        init: function () {
          this.keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
          this.walls = [];
          
          // Обработка нажатий клавиш
          this.keyDownHandler = this.keyDownHandler.bind(this);
          this.keyUpHandler = this.keyUpHandler.bind(this);
          document.addEventListener('keydown', this.keyDownHandler);
          document.addEventListener('keyup', this.keyUpHandler);

          // Сбор данных о стенах после загрузки сцены
          this.el.sceneEl.addEventListener('loaded', () => {
            const wallElements = document.querySelectorAll('[wall-collider]');
            this.walls = Array.from(wallElements).map(wall => {
              return {
                position: wall.getAttribute('position'),
                rotation: wall.getAttribute('rotation') || { x: 0, y: 0, z: 0 },
                width: parseFloat(wall.getAttribute('width')) || 1,
                depth: parseFloat(wall.getAttribute('depth')) || 1
              };
            });
          });
        },

        keyDownHandler: function (evt) {
          if (this.keys.hasOwnProperty(evt.key)) this.keys[evt.key] = true;
        },

        keyUpHandler: function (evt) {
          if (this.keys.hasOwnProperty(evt.key)) this.keys[evt.key] = false;
        },

        tick: function () {
          if (this.walls.length === 0) return;

          const currentPos = this.el.getAttribute('position');
          const camera = this.el.querySelector('a-camera');
          const cameraRot = camera.getAttribute('rotation');
          
          // Вычисляем направление движения на основе поворота камеры (только по оси Y)
          const yaw = cameraRot.y * (Math.PI / 180);
          let moveX = 0;
          let moveZ = 0;

          if (this.keys.w || this.keys.ArrowUp) {
            moveX -= Math.sin(yaw) * this.data.speed;
            moveZ -= Math.cos(yaw) * this.data.speed;
          }
          if (this.keys.s || this.keys.ArrowDown) {
            moveX += Math.sin(yaw) * this.data.speed;
            moveZ += Math.cos(yaw) * this.data.speed;
          }
          if (this.keys.a || this.keys.ArrowLeft) {
            moveX -= Math.cos(yaw) * this.data.speed;
            moveZ += Math.sin(yaw) * this.data.speed;
          }
          if (this.keys.d || this.keys.ArrowRight) {
            moveX += Math.cos(yaw) * this.data.speed;
            moveZ -= Math.sin(yaw) * this.data.speed;
          }

          // Если движения нет, выходим
          if (moveX === 0 && moveZ === 0) return;

          // Предсказываем следующую позицию
          let nextPos = { x: currentPos.x + moveX, y: currentPos.y, z: currentPos.z + moveZ };
          let collisionOccurred = false;

          // Проверка коллизий с каждой стеной
          for (let wall of this.walls) {
            // 1. Переводим координаты игрока в локальное пространство стены
            let dx = nextPos.x - wall.position.x;
            let dz = nextPos.z - wall.position.z;

            // Поворачиваем точку на угол, обратный повороту стены
            let rad = -wall.rotation.y * (Math.PI / 180);
            let cos = Math.cos(rad);
            let sin = Math.sin(rad);

            let localX = dx * cos - dz * sin;
            let localZ = dx * sin + dz * cos;

            // 2. Проверяем пересечение с учетом радиуса игрока
            let halfW = (wall.width / 2) + this.data.radius;
            let halfD = (wall.depth / 2) + this.data.radius;

            if (Math.abs(localX) < halfW && Math.abs(localZ) < halfD) {
              collisionOccurred = true;

              // 3. Разрешение коллизии: выталкиваем игрока по оси наименьшего пересечения
              let overlapX = halfW - Math.abs(localX);
              let overlapZ = halfD - Math.abs(localZ);

              if (overlapX < overlapZ) {
                localX += (localX > 0 ? overlapX : -overlapX);
              } else {
                localZ += (localZ > 0 ? overlapZ : -overlapZ);
              }

              // 4. Переводим координаты обратно в мировое пространство
              let invRad = -rad;
              let invCos = Math.cos(invRad);
              let invSin = Math.sin(invRad);

              let worldX = localX * invCos - localZ * invSin;
              let worldZ = localX * invSin + localZ * invCos;

              nextPos.x = wall.position.x + worldX;
              nextPos.z = wall.position.z + worldZ;
            }
          }

          // Применяем новую позицию (с коллизией или без нее)
          this.el.setAttribute('position', nextPos);
        },

        remove: function () {
          document.removeEventListener('keydown', this.keyDownHandler);
          document.removeEventListener('keyup', this.keyUpHandler);
        }
      });
    </script>
  </body>
</html>
